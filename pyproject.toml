[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ideaforge"
version = "0.1.0"
description = "Persistent agentic creative synthesis engine"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Anmol Sharma" }]
dependencies = [
    "langgraph>=0.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.1",
    "fastembed>=0.3",
    "click>=8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "duckduckgo-search>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[project.scripts]
ideaforge = "ideaforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ideaforge"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
